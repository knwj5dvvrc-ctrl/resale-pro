<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ReSale Pro"><link rel="manifest" href="./manifest.webmanifest"><title>ReSale Pro</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf2ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:22px 16px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:25px;margin:2px 0}h2{font-size:19px}small,.muted{color:#9caec7}.brand{color:#64dfbd;font-weight:800;font-size:12px;letter-spacing:2px}.card{background:#162438;border:1px solid #293b50;border-radius:18px;padding:17px;margin:13px 0;box-shadow:0 8px 25px #0002}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics .card{margin:0}.value{font-size:24px;font-weight:800;margin-top:8px}.green{color:#64dfbd}.red{color:#ff8795}input,select,textarea{background:#0d192a;border:1px solid #3a5067;color:#fff;border-radius:10px;padding:12px;font:inherit;width:100%;min-width:0}label{display:block;font-size:13px;color:#b9c8da;margin:11px 0 5px}button{border:0;background:#4fd5ae;color:#0c2030;padding:12px 16px;border-radius:11px;font-weight:750;cursor:pointer}button.secondary{background:#263b50;color:#e7f2ff}button.danger{background:#583041;color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101c2d;border-top:1px solid #34485c;display:flex;justify-content:center;padding:10px 5px calc(10px + env(safe-area-inset-bottom));z-index:2}.tabs button{flex:1;max-width:130px;background:transparent;color:#aab9cd;font-size:12px;padding:10px 3px}.tabs button.active{color:#4fd5ae;background:#203749}.hidden{display:none}.pill{display:inline-block;border-radius:30px;background:#263d51;color:#b9d5e7;padding:5px 9px;font-size:11px;margin:3px}.item{border-top:1px solid #34485c;padding:13px 0}.item:first-child{border-top:0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{width:100%}.hint{font-size:12px;color:#a9bad0;line-height:1.6}.empty{text-align:center;padding:25px;color:#a9bad0}canvas{max-width:100%}
</style></head><body><main><header><div><div class="brand">GAME RESELLING STUDIO</div><h1>ReSale Pro 🎮</h1><small>仕入れから販売まで、利益を見える化</small></div><button class="secondary" id="exportTop">保存</button></header>
<section id="home"><div class="metrics"><div class="card"><small>実現純利益</small><div id="profitTotal" class="value green">¥0</div></div><div class="card"><small>在庫原価</small><div id="stockTotal" class="value">¥0</div></div><div class="card"><small>販売済み</small><div id="soldCount" class="value">0件</div></div><div class="card"><small>保有在庫</small><div id="stockCount" class="value">0件</div></div></div><div class="card"><h2>今月の売上・利益</h2><div id="monthly"></div></div><div class="card"><h2>最近の商品</h2><div id="recent"></div></div><button class="full" onclick="switchTab('add')">＋ 商品を登録</button></section>
<section id="inventory" class="hidden"><h2>在庫・販売履歴</h2><input id="search" placeholder="タイトル・機種・メモで検索"><label>表示</label><select id="filter"><option value="all">すべて</option><option value="stock">在庫</option><option value="listed">出品中</option><option value="sold">販売済み</option></select><div id="items"></div></section>
<section id="add" class="hidden"><h2 id="formTitle">商品を登録</h2><form id="itemForm"><input type="hidden" id="editId"><label>ゲームタイトル *</label><input id="name" required placeholder="例：妖怪ウォッチ3 スキヤキ"><div class="twocol"><div><label>機種</label><select id="platform"><option>DS</option><option>3DS</option><option>PS2</option><option>PSP</option><option>PS3</option><option>PS4</option><option>PS5</option><option>Switch</option><option>Switch 2</option><option>Wii</option><option>Wii U</option><option>GC</option><option>N64</option><option>GBA</option><option>その他</option></select></div><div><label>状態</label><select id="condition"><option>良好</option><option>やや傷あり</option><option>傷・汚れあり</option><option>ジャンク</option><option>未開封</option></select></div></div><div class="twocol"><div><label>仕入れ値（円） *</label><input id="cost" type="number" min="0" required value="0"></div><div><label>販売予定価格（円）</label><input id="expected" type="number" min="0" value="0"></div><div><label>送料（円）</label><input id="shipping" type="number" min="0" value="210"></div><div><label>梱包・その他費用（円）</label><input id="other" type="number" min="0" value="0"></div><div><label>販売手数料（%）</label><input id="fee" type="number" min="0" max="100" step="0.1" value="10"></div><div><label>仕入れ日</label><input id="buyDate" type="date"></div></div><label>販売状況</label><select id="status"><option value="stock">在庫</option><option value="listed">出品中</option><option value="sold">販売済み</option></select><div class="twocol"><div><label>実際の販売価格（円）</label><input id="actual" type="number" min="0" value="0"></div><div><label>販売日</label><input id="soldDate" type="date"></div></div><div class="twocol"><label><input type="checkbox" id="box" style="width:auto"> 箱あり</label><label><input type="checkbox" id="manual" style="width:auto"> 説明書あり</label><label><input type="checkbox" id="tested" style="width:auto"> 動作確認済み</label><label><input type="checkbox" id="extras" style="width:auto"> 付属品あり</label></div><label>メモ・付属品の詳細</label><textarea id="notes" rows="3"></textarea><div class="card"><small>想定純利益</small><div class="value green" id="preview">¥0</div><small id="previewMargin"></small></div><button class="full" type="submit">商品を保存</button><button type="button" class="secondary full" style="margin-top:8px" id="resetForm">新規入力に戻す</button></form></section>
<section id="tools" class="hidden"><h2>仕入れ判断ツール</h2><div class="card"><label>想定売価（円）</label><input id="calcSell" type="number" min="0" value="5000"><div class="twocol"><div><label>送料（円）</label><input id="calcShip" type="number" min="0" value="210"></div><div><label>手数料（%）</label><input id="calcFee" type="number" min="0" max="100" value="10"></div><div><label>目標利益（円）</label><input id="calcTarget" type="number" min="0" value="1500"></div><div><label>梱包等（円）</label><input id="calcOther" type="number" min="0" value="0"></div></div><small>目標利益を確保できる仕入れ上限</small><div class="value green" id="maxBuy">¥0</div><p class="hint">相場は自動取得しません。実際の売却相場は各サービスの売り切れ履歴などを確認して入力してください。</p></div><div class="card"><h2>バックアップ</h2><p class="hint">データはこの端末のブラウザ内に保存されます。機種変更やブラウザのデータ削除に備えて定期的にバックアップしてください。</p><button id="export">JSONを書き出す</button><label>バックアップを読み込む（現在のデータを置換）</label><input type="file" id="import" accept="application/json,.json"></div></section></main><nav class="tabs"><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="inventory">▤<br>在庫</button><button data-tab="add">＋<br>登録</button><button data-tab="tools">▥<br>分析・設定</button></nav><script>
'use strict';const KEY='resale-pro-v1';let data=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))data=x}catch{}const $=id=>document.getElementById(id);const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const num=id=>Number($(id).value)||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function profit(x){const sale=x.status==='sold'?Number(x.actual):Number(x.expected);return Math.round(sale*(1-Number(x.fee)/100)-Number(x.cost)-Number(x.shipping)-Number(x.other))}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function switchTab(t){document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==t));document.querySelectorAll('.tabs button').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));render();window.scrollTo(0,0)}window.switchTab=switchTab;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function render(){const sold=data.filter(x=>x.status==='sold'),stock=data.filter(x=>x.status!=='sold');const total=sold.reduce((a,x)=>a+profit(x),0);$('profitTotal').textContent=yen(total);$('profitTotal').className='value '+(total<0?'red':'green');$('stockTotal').textContent=yen(stock.reduce((a,x)=>a+Number(x.cost),0));$('soldCount').textContent=sold.length+'件';$('stockCount').textContent=stock.length+'件';const month=new Date().toISOString().slice(0,7);const monthSold=sold.filter(x=>(x.soldDate||'').startsWith(month));$('monthly').innerHTML=`<div class="row"><span>売上</span><strong>${yen(monthSold.reduce((a,x)=>a+Number(x.actual),0))}</strong></div><div class="row" style="margin-top:12px"><span>純利益</span><strong class="green">${yen(monthSold.reduce((a,x)=>a+profit(x),0))}</strong></div>`;$('recent').innerHTML=data.length?data.slice(-4).reverse().map(x=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><span class="pill">${esc(x.platform)}</span></div><small>${x.status==='sold'?'販売済み':x.status==='listed'?'出品中':'在庫'} / 仕入 ${yen(x.cost)}</small></div>`).join(''):'<div class="empty">商品を登録するとここに表示されます</div>';renderItems();updatePreview();updateMax()};function renderItems(){const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=data.filter(x=>(f==='all'||x.status===f)&&[x.name,x.platform,x.notes].join(' ').toLowerCase().includes(q)).slice().reverse();$('items').innerHTML=rows.length?rows.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill">${esc(x.platform)}</span></div><p class="muted" style="font-size:12px">${esc(x.condition)} · ${x.status==='sold'?'販売済み':x.status==='listed'?'出品中':'在庫'} · ${x.box?'箱あり':'箱なし'} · ${x.manual?'説明書あり':'説明書なし'}</p><div class="row"><span>仕入 ${yen(x.cost)}</span><strong class="${profit(x)<0?'red':'green'}">${x.status==='sold'?'実利益':'予想利益'} ${yen(profit(x))}</strong></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="editItem('${esc(x.id)}')">編集</button><button class="danger" onclick="deleteItem('${esc(x.id)}')">削除</button></div></div>`).join(''):'<div class="empty">該当する商品がありません</div>'}function updatePreview(){const p=Math.round(num('expected')*(1-num('fee')/100)-num('cost')-num('shipping')-num('other'));$('preview').textContent=yen(p);$('preview').className='value '+(p<0?'red':'green');$('previewMargin').textContent='売上利益率 '+(num('expected')?((p/num('expected'))*100).toFixed(1):'0')+'%'}function updateMax(){const v=Math.floor(num('calcSell')*(1-num('calcFee')/100)-num('calcShip')-num('calcOther')-num('calcTarget'));$('maxBuy').textContent=yen(Math.max(0,v));$('maxBuy').className='value '+(v<0?'red':'green');if(v<0)$('maxBuy').textContent='条件を満たす仕入れ価格なし'}['cost','expected','shipping','other','fee'].forEach(id=>$(id).addEventListener('input',updatePreview));['calcSell','calcFee','calcShip','calcOther','calcTarget'].forEach(id=>$(id).addEventListener('input',updateMax));$('search').oninput=renderItems;$('filter').onchange=renderItems;function reset(){ $('itemForm').reset();$('editId').value='';$('formTitle').textContent='商品を登録';$('buyDate').value=new Date().toLocaleDateString('sv-SE');$('fee').value='10';$('shipping').value='210';updatePreview()}$('resetForm').onclick=reset;$('itemForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()));const fields=['name','platform','condition','cost','expected','shipping','other','fee','buyDate','status','actual','soldDate','box','manual','tested','extras','notes'];const x={id};fields.forEach(k=>x[k]=['box','manual','tested','extras'].includes(k)?$(k).checked:$(k).value);if(x.status==='sold'&&(!x.soldDate||Number(x.actual)<0)){alert('販売日を入力してください');return}const i=data.findIndex(a=>a.id===id);if(i>=0)data[i]=x;else data.push(x);save();reset();switchTab('inventory')};window.editItem=id=>{const x=data.find(a=>a.id===id);if(!x)return;Object.keys(x).forEach(k=>{if($(k)) {if($(k).type==='checkbox')$(k).checked=!!x[k];else $(k).value=x[k]}});$('editId').value=x.id;$('formTitle').textContent='商品を編集';switchTab('add')};window.deleteItem=id=>{if(confirm('この商品を削除しますか？')){data=data.filter(x=>x.id!==id);save()}};function exportData(){const blob=new Blob([JSON.stringify({app:'ReSale Pro',version:1,items:data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='resale-pro-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('export').onclick=exportData;$('exportTop').onclick=exportData;$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='ReSale Pro'||!Array.isArray(obj.items))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data=obj.items;save();alert('読み込み完了')}catch(err){alert('読み込み失敗: '+err.message)}finally{e.target.value=''}};reset();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="./bundles.js?v=4"></script><script src="./market.js?v=4"></script></body></html>
